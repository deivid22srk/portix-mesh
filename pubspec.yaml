name: portix
description: "PORTIX — biblioteca de ports de jogos para Android, com catálogo público, favoritos e downloads simulados."
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Flutter 3.50 moveu o Material para `material_ui`; `package:flutter/material.dart`
  # virou um shim obsoleto.
  material_ui: ^1.11.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  cached_network_image: ^4.0.7
  flutter_cache_manager: ^3.5.0
  shared_preferences: ^2.5.6
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.3
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Catálogo embutido no APK (gerado por tools/catalog/build_catalog.py).
  # É o que torna a navegação e a busca independentes de qualquer servidor.
  assets:
    - assets/catalog/

  # Poppins embutida (OFL, ver assets/fonts/OFL.txt). Sem fetch em runtime:
  # tipografia idêntica offline e goldens determinísticos.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#0A0A16"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#06060C"
  image: assets/branding/splash_logo.png
  android: true
  ios: false
  web: false
  fullscreen: true
  android_12:
    color: "#06060C"
    image: assets/branding/splash_logo.png
    icon_background_color: "#0A0A16"
